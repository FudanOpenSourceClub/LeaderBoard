name: Contributor Enrollment and Export E2E
on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Deploy LeadBoard"]
    types: [completed]
permissions:
  contents: read
jobs:
  public-smoke:
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    timeout-minutes: 8
    steps:
      - name: Verify public pages, authentication gates, catalog, rewards, and disabled exports
        run: |
          python3 - <<'PY'
          import urllib.request, urllib.error, ssl, json, re
          base='https://47.116.20.196'; context=ssl._create_unverified_context()
          def request(path,method='GET',data=None,expected=200):
              req=urllib.request.Request(base+path,method=method,data=json.dumps(data).encode() if data is not None else None,headers={'Content-Type':'application/json'})
              try: response=urllib.request.urlopen(req,context=context,timeout=25)
              except urllib.error.HTTPError as error: response=error
              assert response.status==expected,(path,response.status)
              raw=response.read().decode('utf-8-sig')
              return json.loads(raw) if 'json' in response.headers.get('Content-Type','') else raw
          assert request('/health')=={'status':'ok'}
          assert request('/api/v1/auth/session')=={'authenticated':False}
          assert request('/api/v1/auth/registration/status?github=success&login=FakeUser')=={'registered':False}
          # Website content is now login-gated; do not try to read private
          # leaderboard data without a session or assert obsolete public copy.
          gated_paths = [
              '/api/v1/admin/project-proposals',
              '/api/v1/projects',
              '/api/v1/contributors/leaderboard?range=all&metric=score&limit=10',
              '/api/v1/contributors/swiftgorge5-eng?range=all',
              '/api/v1/contributors/Zecyel/export.csv',
              '/api/v1/public-contributors/Zecyel/export.csv',
              '/api/v1/sync/status',
          ]
          for path in gated_paths:
              assert request(path,expected=401)['error']['code']=='LOGIN_REQUIRED',path
          # A rejected application must not create data or call GitHub.
          assert request('/api/v1/project-proposals','POST',{'projectUrl':'https://github.com/FudanNLP/fastNLP','labName':'fixture','notes':'authentication smoke fixture'},401)['error']['code']=='LOGIN_REQUIRED'
          index=request('/projects')
          assert '<!doctype html>' in index.lower()
          script=re.search(r'src="([^"]+\.js)"',index)
          assert script is not None,'missing frontend JavaScript'
          assert len(request(script.group(1)))>100
          assert '<!doctype html>' in request('/admin').lower()
          print('Public smoke passed: health, login gates, registration status, and static frontend assets')
          PY
