name: Restart LeadBoard

on:
  push:
    paths:
      - ".github/workflows/restart-leadboard.yml"

permissions:
  contents: read

jobs:
  restart:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 5
    steps:
      - name: Enable autostart, restart service, and verify health
        shell: bash
        run: |
          set -euo pipefail
          sudo systemctl enable leadboard.service
          sudo systemctl restart leadboard.service
          systemctl is-enabled --quiet leadboard.service
          systemctl is-active --quiet leadboard.service
          ok=0
          for i in $(seq 1 20); do
            if curl -fsS --max-time 3 http://127.0.0.1:3000/health | grep -q '"status":"ok"'; then
              ok=1
              break
            fi
            sleep 1
          done
          test "$ok" = "1"
          curl -fsS --max-time 5 http://127.0.0.1/health | grep -q '"status":"ok"'
          curl -fsS --max-time 5 -H 'Accept: text/html' http://127.0.0.1/ | grep -qi '<!doctype html>'
          echo "LeadBoard running; autostart enabled; backend, Nginx, and homepage healthy."
