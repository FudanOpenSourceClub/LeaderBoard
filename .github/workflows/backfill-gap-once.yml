name: One-time missing contribution recovery
on:
  push:
    branches: ["ops/backfill-gap-20261111"]
    paths: [".github/workflows/backfill-gap-once.yml"]
permissions:
  contents: read
jobs:
  recover:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 90
    steps:
      - name: Recover missed six-hour windows
        shell: bash
        run: |
          set -euo pipefail
          release="$(systemctl show -p WorkingDirectory --value leadboard.service)"
          cd "$release"
          temp_env="$(mktemp /tmp/leadboard-recovery.XXXXXX)"
          trap 'sudo rm -f "$temp_env"' EXIT
          sudo install -o leadboard -g leadboard -m 600 /etc/leadboard/leadboard.env "$temp_env"
          sudo -u leadboard /usr/local/bin/leadboard-node --env-file="$temp_env" --input-type=module <<'JS'
          import pg from 'pg';
          import { pathToFileURL } from 'node:url';
          const pool = new pg.Pool({connectionString:process.env.DATABASE_URL});
          const {saveContributorActivity} = await import(pathToFileURL(process.cwd()+'/backend/dist/public-contributions/enrollment.js'));
          const token=process.env.GITHUB_TOKEN;
          const headers={Accept:'application/vnd.github+json',Authorization:'Bearer '+token,'User-Agent':'LeadBoard-recovery','X-GitHub-Api-Version':'2022-11-28'};
          const pause=ms=>new Promise(r=>setTimeout(r,ms));
          let lastSearch=0;
          async function get(url,search=false) {
            for(let attempt=0;attempt<4;attempt++){
              if(search){await pause(Math.max(0,2200-(Date.now()-lastSearch)));lastSearch=Date.now();}
              const response=await fetch(url,{headers,signal:AbortSignal.timeout(30000)});
              if(response.ok) return response.json();
              if([403,429,500,502,503,504].includes(response.status) && attempt<3){await pause(15000*(attempt+1));continue;}
              throw new Error('GitHub HTTP '+response.status);
            }
          }
          const cutoff=new Date('2026-11-07T04:00:00.036Z');
          const endTime=new Date();
          const repoIds=new Map();
          let failed=0, completed=0, saved=0;
          try {
            const accounts=await pool.query(`SELECT github_id::text,login,public_synced_at
              FROM contributors WHERE enrolled_at IS NOT NULL ORDER BY id`);
            console.log('Recovery accounts:',accounts.rows.length,'cutoff:',cutoff.toISOString(),'end:',endTime.toISOString());
            for (const account of accounts.rows) {
              try {
                const user=await get('https://api.github.com/user/'+account.github_id);
                if(String(user.id)!==account.github_id || user.type!=='User') throw Error('Account identity mismatch');
                const start=account.public_synced_at && account.public_synced_at>cutoff ? account.public_synced_at : cutoff;
                let total=0, windows=0;
                for(let from=start.getTime();from<endTime.getTime();from+=21600000){
                  const to=Math.min(from+21600000,endTime.getTime());
                  const fromIso=new Date(from).toISOString().replace(/\.\d{3}Z$/,'Z');
                  const toIso=new Date(to).toISOString().replace(/\.\d{3}Z$/,'Z');
                  const rows=[];
                  for(const kind of ['commit','pull_request','issue']){
                    const url=new URL('https://api.github.com/search/'+(kind==='commit'?'commits':'issues'));
                    const field=kind==='commit'?'committer-date':'updated';
                    url.searchParams.set('q','author:'+user.login+(kind==='commit'?'':' is:'+(kind==='pull_request'?'pr':'issue'))+' '+field+':>='+fromIso+' '+field+':<'+toIso);
                    url.searchParams.set('per_page','100');
                    url.searchParams.set('sort',kind==='commit'?'author-date':'created');
                    url.searchParams.set('order','desc');
                    const result=await get(url,true);
                    if(result.incomplete_results || !Array.isArray(result.items)) throw Error('Incomplete GitHub search');
                    for(const item of result.items.slice(0,50)){
                      if(String((kind==='commit'?item.author:item.user)?.id)!==account.github_id) throw Error('Contribution identity mismatch');
                      const repo=kind==='commit'?item.repository?.full_name:item.repository_url?.replace('https://api.github.com/repos/','');
                      const occurredAt=kind==='commit'?item.commit?.author?.date:item.created_at;
                      const identifier=kind==='commit'?item.sha:String(item.number??'');
                      if(!repo || !/^[^/]+\/[^/]+$/.test(repo) || !occurredAt || !identifier || !item.html_url?.startsWith('https://github.com/')) continue;
                      let repoId=item.repository?.id?String(item.repository.id):repoIds.get(repo.toLowerCase());
                      if(!repoId){const meta=await get('https://api.github.com/repos/'+repo);repoId=String(meta.id);if(!/^[1-9]\d*$/.test(repoId))throw Error('Invalid repository ID');repoIds.set(repo.toLowerCase(),repoId);}
                      rows.push({kind,repository:repo,repositoryGithubId:repoId,objectGithubId:item.id?String(item.id):null,occurredAt,identifier,title:kind==='commit'?(item.commit?.message??'').split('\n')[0]:(item.title??''),url:item.html_url,mergedAt:kind==='pull_request'?item.pull_request?.merged_at??null:null});
                    }
                  }
                  rows.sort((a,b)=>b.occurredAt.localeCompare(a.occurredAt)||a.url.localeCompare(b.url));
                  const selected=rows.slice(0,50);
                  await saveContributorActivity({githubId:account.github_id,login:user.login,avatarUrl:user.avatar_url}, {rows:selected,totals:{commit:0,pull_request:0,issue:0},truncated:to<endTime.getTime(),incomplete:false},pool);
                  total+=selected.length;windows++;
                }
                completed++;saved+=total;
                console.log('Completed account',completed,'windows',windows,'records processed',total);
              }catch(error){failed++;console.error('Account recovery failed:',error instanceof Error?error.message:'unknown');}
            }
            console.log(JSON.stringify({accounts:accounts.rows.length,completed,failed,recordsProcessed:saved}));
            if(failed)process.exitCode=1;
          } finally {await pool.end();}
          JS
