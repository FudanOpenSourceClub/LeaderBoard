name: Contributor Enrollment and Export E2E
on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Deploy LeadBoard"]
    types: [completed]
permissions:
  contents: read
jobs:
  public-smoke:
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    timeout-minutes: 8
    steps:
      - name: Verify public pages, authentication gates, catalog, rewards, and disabled exports
        run: |
          python3 - <<'PY'
          import urllib.request, urllib.error, ssl, json, re
          base='https://47.116.20.196'; context=ssl._create_unverified_context()
          def request(path,method='GET',data=None,expected=200):
              req=urllib.request.Request(base+path,method=method,data=json.dumps(data).encode() if data is not None else None,headers={'Content-Type':'application/json'})
              try: response=urllib.request.urlopen(req,context=context,timeout=25)
              except urllib.error.HTTPError as error: response=error
              assert response.status==expected,(path,response.status)
              raw=response.read().decode('utf-8-sig')
              return json.loads(raw) if 'json' in response.headers.get('Content-Type','') else raw
          assert request('/health')=={'status':'ok'}
          assert request('/api/v1/auth/session')=={'authenticated':False}
          assert request('/api/v1/auth/registration/status?github=success&login=FakeUser')=={'registered':False}
          assert request('/api/v1/admin/project-proposals',expected=401)['error']['code']=='REGISTRATION_REQUIRED'
          # This rejected request must not create an application, send email, or access GitHub.
          assert request('/api/v1/project-proposals','POST',{'projectUrl':'https://github.com/FudanNLP/fastNLP','labName':'fixture','notes':'authentication smoke fixture'},401)['error']['code']=='REGISTRATION_REQUIRED'
          projects=request('/api/v1/projects')['items']; assert len(projects)>=3
          assert {'FudanNLP/fastNLP','FudanNLP/fastHan','FudanSELab/ClassEval'}.issubset({p['repo'] for p in projects})
          for prefix in ['contributors','public-contributors']:
              assert request(f'/api/v1/{prefix}/Zecyel/export.csv',expected=410)['error']['code']=='EXPORT_DISABLED'
          for login in ['swiftgorge5-eng','Alpha-dev-code','Linscon','Joseph2433']:
              person=request(f'/api/v1/contributors/{login}?range=all')
              assert person['bonusScore']==50 and person['score']>=50
              assert not any(field in person for field in ['studentId','student_fingerprint','email_fingerprint','name'])
          board=request('/api/v1/contributors/leaderboard?range=all&metric=score&limit=10'); assert len(board['items'])<=10
          index=request('/projects'); bundle=request(re.search(r'src="([^"]+\.js)"',index).group(1))
          assert '复旦开源仓库必吃榜' in bundle and '请先注册 LeaderBoard' in bundle
          assert '无 Star 门槛' in bundle and '仅白名单仓库' in bundle
          assert '/export.csv' not in bundle and '导出 CSV' not in bundle
          assert '<!doctype html>' in request('/admin')
          print('Public smoke passed: catalog, permissions, rewards, backend registration confirmation, disabled exports')
          PY
