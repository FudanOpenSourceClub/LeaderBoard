name: One-time LeadBoard host storage audit
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-time-host-storage-audit.yml"
permissions:
  contents: read
jobs:
  inventory:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 8
    steps:
      - name: Inspect storage and service boundaries (read-only)
        shell: bash
        run: |
          set -u
          echo "HOST=$(hostname)"
          echo "=== storage ==="
          df -h /
          echo "=== root directory sizes KiB (no contents) ==="
          sudo -n du -x -d1 / 2>/dev/null | sort -nr | head -22 || true
          for p in /opt /home/admin /root /srv /var/www /var/lib /var/cache /usr/local; do
            if [ -d "$p" ]; then
              echo "=== directory sizes KiB: $p ==="
              sudo -n du -x -d1 "$p" 2>/dev/null | sort -nr | head -30 || true
            fi
          done
          echo "=== LeadBoard live release ==="
          systemctl show leadboard.service -p WorkingDirectory -p ExecStart -p FragmentPath --no-pager || true
          sudo -n find /opt/leadboard -mindepth 1 -maxdepth 2 -type d -name releases -o -name current 2>/dev/null | head -20 || true
          echo "=== non-core service unit names ==="
          sudo -n find /etc/systemd/system -maxdepth 2 -type f -name '*.service' -printf '%p\n' 2>/dev/null | head -50 || true
          echo "=== docker containers (names only) ==="
          sudo -n docker ps -a --format '{{.Names}}' 2>/dev/null || true
          echo "=== pm2 process summary ==="
          pm2 jlist 2>/dev/null | head -c 300 || true
          echo
      - name: Classify user-data, releases and snap packages (read-only)
        shell: bash
        run: |
          set -u
          echo "=== workspace top-level KiB ==="
          sudo -n du -x -d1 /home/admin/workspace 2>/dev/null | sort -nr | head -45 || true
          echo "=== LeadBoard release sizes KiB ==="
          sudo -n du -x -d1 /opt/leadboard 2>/dev/null | sort -nr | head -22 || true
          sudo -n du -x -d1 /opt/leadboard/releases 2>/dev/null | sort -nr | head -25 || true
          echo "=== snap installed ==="
          snap list 2>/dev/null || true
          echo "=== snap package file sizes KiB ==="
          sudo -n du -x -d1 /var/lib/snapd/snaps 2>/dev/null | sort -nr | head -28 || true
          echo "=== root cache top-level KiB ==="
          sudo -n du -x -d1 /root/.cache 2>/dev/null | sort -nr | head -20 || true
          echo "=== active symlinks ==="
          sudo -n readlink -f /usr/local/bin/leadboard-node || true
          command -v certbot || true
          echo "=== app health before cleanup ==="
          curl -fsS --max-time 5 http://127.0.0.1:3000/health || true
          echo
