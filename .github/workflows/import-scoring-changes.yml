name: Import and validate scoring changes
on:
  push:
    branches: [feat/restricted-tags-no-stars]
    paths: [.github/workflows/import-scoring-changes.yml]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: leadboard
          POSTGRES_PASSWORD: leadboard
          POSTGRES_DB: leadboard
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U leadboard -d leadboard"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://leadboard:leadboard@localhost:5432/leadboard
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Import reviewed source and remove this temporary workflow
        shell: bash
        run: |
          set -euo pipefail
