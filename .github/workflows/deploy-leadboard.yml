name: Deploy LeadBoard
# campus project board deployment trigger

on:
  workflow_dispatch:
    inputs:
      oauth_action:
        description: "Deploy website or configure GitHub identity verification"
        type: choice
        options: [deploy, configure]
        default: deploy
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - "frontend/**"
      - "db/**"
      - "packages/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - "contributors.json"
      - "scoring-whitelist.json"
      - ".github/workflows/deploy-leadboard.yml"

permissions:
  contents: read

jobs:
  deploy:
    if: github.event_name != 'workflow_dispatch' || inputs.oauth_action == 'deploy'
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 20
    steps:
      - name: Build, migrate, and deploy LeadBoard
        shell: bash
        run: |
          set -euo pipefail

          echo "=== Preflight ==="
          for key in GITHUB_TOKEN GITHUB_ORG DATABASE_URL SMTP_HOST SMTP_PORT SMTP_USER SMTP_PASSWORD MAIL_FROM EMAIL_HMAC_SECRET; do
            sudo grep -q "^${key}=" /etc/leadboard/leadboard.env || {
              echo "::error::Missing ${key} in /etc/leadboard/leadboard.env"
              exit 1
            }
          done

          stamp="$(date -u +%Y%m%d%H%M%S)"
          sha="${GITHUB_SHA:0:8}"
          release="/opt/leadboard/releases/${stamp}-${sha}"
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT

          echo "=== Download exact commit ==="
          archive="$work/source.tar.gz"
          curl -fL --retry 8 --retry-delay 3 --retry-all-errors --connect-timeout 15 --max-time 300             "https://codeload.github.com/swiftgorge5-eng/LeaderBoard/tar.gz/${GITHUB_SHA}"             -o "$archive"
          mkdir -p "$work/src"
          tar -xzf "$archive" -C "$work/src" --strip-components=1
          cd "$work/src"

          echo "=== Use server Node 24 runtime ==="
          npm_cli="$(readlink -f "$(command -v npm)")"
          test -f "$npm_cli"
          nodebin="$work/node24bin"
          mkdir -p "$nodebin"
          ln -s /usr/local/bin/leadboard-node "$nodebin/node"
          cat > "$nodebin/npm" <<NPMWRAP
          #!/usr/bin/env bash
          exec /usr/local/bin/leadboard-node "$npm_cli" "\$@"
          NPMWRAP
          chmod +x "$nodebin/npm"
          export PATH="$nodebin:$PATH"
          node --version
          npm --version

          echo "=== Install and build ==="
          npm ci --include=optional
          if [ -f node_modules/rolldown/package.json ] && [ ! -d node_modules/@rolldown/binding-linux-x64-gnu ]; then
            binding_version="$(node -p "require('./node_modules/rolldown/package.json').optionalDependencies['@rolldown/binding-linux-x64-gnu']")"
            npm install --no-save "@rolldown/binding-linux-x64-gnu@$binding_version"
          fi
          npm run build

          echo "=== Create immutable release ==="
          sudo mkdir -p "$release"
          sudo cp -a . "$release/"
          sudo rm -rf "$release/.git"
          sudo chown -R root:root "$release"
          sudo chmod -R a+rX "$release"

          echo "=== Database migration ==="
          sudo install -o leadboard -g leadboard -m 600 /etc/leadboard/leadboard.env "$release/.env"
          sudo -u leadboard bash -c "cd '$release' && /usr/local/bin/leadboard-node --env-file=.env scripts/db-migrate.mjs"
          sudo -u leadboard bash -c "cd '$release' && /usr/local/bin/leadboard-node --env-file=.env scripts/sync-contributors.mjs"
          sudo rm -f "$release/.env"

          echo "=== Switch systemd release ==="
          sudo mkdir -p /etc/systemd/system/leadboard.service.d
          printf '[Service]\nWorkingDirectory=%s\n' "$release" | sudo tee /etc/systemd/system/leadboard.service.d/release.conf >/dev/null
          sudo systemctl daemon-reload
          sudo systemctl restart leadboard.service

          echo "=== Health checks ==="
          ok=0
          for i in $(seq 1 20); do
            if curl -fsS --max-time 3 http://127.0.0.1:3000/health | grep -q '"status":"ok"'; then
              ok=1
              break
            fi
            sleep 1
          done
          if [ "$ok" -ne 1 ]; then
            echo "::error::LeadBoard failed health check"
            sudo systemctl status leadboard.service --no-pager || true
            sudo journalctl -u leadboard.service -n 80 --no-pager || true
            exit 1
          fi

          curl -fsS --max-time 5 -H 'Accept: text/html' http://127.0.0.1:3000/join | grep -qi '<!doctype html>'
          status="$(curl -sS -o /tmp/leadboard-auth-check.json -w '%{http_code}' -H 'Content-Type: application/json' -d '{"email":"not-fudan@example.com"}' http://127.0.0.1:3000/api/v1/auth/email/send-code)"
          test "$status" = "400"

          echo "=== Public reverse proxy ==="
          curl -fsS --max-time 5 http://127.0.0.1/health | grep -q '"status":"ok"'

          echo "Deployment successful."
          echo "Release: $release"
          echo "Health: OK"
          echo "Join page: OK"
          echo "Email API: active"
          echo "Nginx proxy: OK"
          if [ "$(sudo grep -Ec '^GITHUB_OAUTH_(CLIENT_ID|CLIENT_SECRET|CALLBACK_URL)=.+' /etc/leadboard/leadboard.env)" = "3" ]; then
            echo "GitHub OAuth: configured"
          else
            echo "GitHub OAuth: not configured"
          fi

  configure_oauth:
    if: github.event_name == 'workflow_dispatch' && inputs.oauth_action == 'configure'
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 5
    concurrency:
      group: leadboard-oauth-configuration
      cancel-in-progress: false
    steps:
      - name: Install OAuth settings from encrypted repository secret
        shell: bash
        env:
          OAUTH_CLIENT_SECRET: ${{ secrets.LEADERBOARD }}
        run: |
          set -euo pipefail
          umask 077
          if [ -z "$OAUTH_CLIENT_SECRET" ]; then
            echo "::error::Set LEADERBOARD in repository Actions secrets first."
            exit 1
          fi
          [[ "$OAUTH_CLIENT_SECRET" =~ ^[A-Za-z0-9_]{20,128}$ ]]
          work="$(mktemp -d /dev/shm/leadboard-oauth.XXXXXX)"
          trap 'rm -rf "$work"' EXIT
          cat > "$work/install.py" <<'PY'
          import os,pathlib,sys,tempfile,re
          secret=sys.stdin.read()
          assert re.fullmatch(r'[A-Za-z0-9_]{20,128}',secret), 'Invalid secret format'
          target=pathlib.Path('/etc/leadboard/leadboard.env')
          keys={'GITHUB_OAUTH_CLIENT_ID':'Ov23lievDY5nyA4XfsgX',
                'GITHUB_OAUTH_CLIENT_SECRET':secret,
                'GITHUB_OAUTH_CALLBACK_URL':'https://47.116.20.196/api/v1/auth/github/callback'}
          original=target.read_text()
          backup=pathlib.Path('/etc/leadboard/oauth-before.env')
          backup.write_text(original)
          backup.chmod(0o600)
          lines=[line for line in original.splitlines() if line.split('=',1)[0] not in keys]
          lines.extend(f'{k}={v}' for k,v in keys.items())
          fd,name=tempfile.mkstemp(dir=target.parent,prefix='.oauth-env-')
          with os.fdopen(fd,'w') as output:
              output.write('\n'.join(lines)+'\n')
              output.flush()
              os.fsync(output.fileno())
          os.chmod(name,0o600)
          stat=target.stat()
          os.chown(name,stat.st_uid,stat.st_gid)
          os.replace(name,target)
          print('OAuth settings installed; credentials hidden.')
          PY
          printf '%s' "$OAUTH_CLIENT_SECRET" | sudo python3 "$work/install.py"
          unset OAUTH_CLIENT_SECRET
          rollback() {
            sudo cp /etc/leadboard/oauth-before.env /etc/leadboard/leadboard.env
            sudo chmod 600 /etc/leadboard/leadboard.env
            sudo systemctl restart leadboard.service
          }
          if ! sudo systemctl restart leadboard.service; then rollback; exit 1; fi
          ok=0
          for attempt in $(seq 1 15); do
            if curl -fsS --max-time 3 http://127.0.0.1:3000/health | grep -q '"status":"ok"'; then ok=1; break; fi
            sleep 1
          done
          if [ "$ok" != 1 ]; then rollback; exit 1; fi
          release="$(systemctl show -p WorkingDirectory --value leadboard.service)"
          if ! sudo /usr/local/bin/leadboard-node --env-file=/etc/leadboard/leadboard.env --input-type=module - "$release" <<'JS'
          import { pathToFileURL } from 'node:url';
          const root=process.argv[2];
          const {createGitHubLinkServiceFromEnv,GitHubOAuthLinkService}=await import(pathToFileURL(root+'/backend/dist/auth/github-link.js'));
          if (!(createGitHubLinkServiceFromEnv() instanceof GitHubOAuthLinkService)) throw new Error('OAuth provider is unavailable');
          const response=await fetch('https://github.com/login/oauth/access_token',{
            method:'POST',headers:{Accept:'application/json','Content-Type':'application/x-www-form-urlencoded'},
            body:new URLSearchParams({client_id:process.env.GITHUB_OAUTH_CLIENT_ID,client_secret:process.env.GITHUB_OAUTH_CLIENT_SECRET,code:'leaderboard-configuration-check-invalid-code'}),
            signal:AbortSignal.timeout(15000)
          });
          const result=await response.json();
          if(result.error!=='bad_verification_code') throw new Error('GitHub OAuth credential check failed');
          console.log('GitHub recognized application credentials; synthetic authorization code correctly rejected.');
          JS
          then rollback; exit 1; fi
          curl -fsS --max-time 10 https://47.116.20.196/health | grep -q '"status":"ok"'
          status="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 5 'http://127.0.0.1:3000/api/v1/auth/github/callback?error=access_denied')"
          test "$status" = 303
          sudo rm -f /etc/leadboard/oauth-before.env
          echo 'OAuth configured. Service healthy. HTTPS and callback route verified.'
