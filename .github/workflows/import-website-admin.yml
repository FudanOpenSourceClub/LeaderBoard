name: Import and validate website administration
on:
  push:
    branches: [feat/70-website-admin]
    paths: [website-admin.patch, .github/workflows/import-website-admin.yml]
permissions:
  contents: write
jobs:
  import-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://leadboard:leadboard@localhost:5432/leadboard
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: leadboard
          POSTGRES_PASSWORD: leadboard
          POSTGRES_DB: leadboard
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/70-website-admin
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Import reviewed source patch on the feature branch
        run: |
          set -euo pipefail
          if test -f website-admin.patch; then
            git apply --exclude='.github/workflows/*' website-admin.patch
            git rm website-admin.patch
            git add backend frontend packages db scripts docs .env.example
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'feat: add database website roles and audited score adjustments'
            git push origin HEAD:feat/70-website-admin
          fi
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run db:migrate
      - run: npm run db:verify
      - run: npm run test:integration
      - run: npm run test:pipeline
      - run: npm run test:e2e
